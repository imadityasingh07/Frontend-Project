<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 7 Exercises</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>7d. Rounded Search Box</h2>
    <input class="search-box" type="text" placeholder="Search" />

    <h2>7e. Search Box with Shadow</h2>
    <input
      class="google-search"
      type="text"
      placeholder="Search Google or type a URL"
    />

    <h2>7f. LinkedIn Signup</h2>

    <p class="email-label">Email</p>
    <input class="linkedin-input" type="text" />

    <p class="privacy-text">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>

    <button class="linkedin-btn">Agree & Join</button>

    <h2>7g. Twitter Text Box</h2>

    <div class="tweet-box">
      <img
        class="profile-pic"
        src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=500"
        alt="cat"
      />

      <input class="tweet-input" type="text" placeholder="What's happening?" />

      <button class="tweet-btn">Tweet</button>
    </div>
  </body>
</html>
